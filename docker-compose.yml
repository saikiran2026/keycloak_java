services:
  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: keycloak-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - keycloak-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: keycloak-jaeger
    command:
      - --span-storage.type=elasticsearch
      - --es.server-urls=http://elasticsearch:9200
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - SPAN_STORAGE_ELASTICSEARCH_SERVER_URLS=http://elasticsearch:9200
      - SPAN_STORAGE_ELASTICSEARCH_TAG_DOT_REPLACEMENT=_
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "14268:14268"  # Jaeger collector HTTP
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - keycloak-network

  keycloak:
    image: keycloak:local
    container_name: keycloak-server
    command:
      - start-dev
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres:5432/keycloak
      - --db-username=keycloak
      - --db-password=keycloak
      - --tracing-enabled=true
      - --tracing-endpoint=http://jaeger:4317
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --bootstrap-admin-username=admin
      - --bootstrap-admin-password=admin
    environment:
      - KC_ADMIN=admin
      - KC_ADMIN_PASSWORD=admin
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - keycloak-network

volumes:
  postgres_data:
  elasticsearch_data:

networks:
  keycloak-network:
    driver: bridge

